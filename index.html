    <div class="lb-counter" id="lbCounter"></div>

<script>
// generic carousel
function initCarousel(carId, prevId, nextId, dotsId){
    const cc=document.getElementById(carId);
    if(!cc) return;
    const slides=[...cc.children];
    const dotsBox=document.getElementById(dotsId);
    slides.forEach((_,i)=>{const d=document.createElement('div');d.className='d'+(i===0?' on':'');d.addEventListener('click',()=>go(i));dotsBox.appendChild(d);});
    const dots=[...dotsBox.children];
    function step(){const s=slides[0];const g=parseFloat(getComputedStyle(cc).gap)||14;return s.getBoundingClientRect().width+g;}
    function idx(){return Math.round(cc.scrollLeft/step());}
    function go(i){i=Math.max(0,Math.min(slides.length-1,i));cc.scrollTo({left:i*step(),behavior:'smooth'});}
    function upd(){const i=idx();dots.forEach((d,k)=>d.classList.toggle('on',k===i));}
    document.getElementById(prevId).addEventListener('click',()=>go(idx()-1));
    document.getElementById(nextId).addEventListener('click',()=>go(idx()+1));
    cc.addEventListener('scroll',()=>{clearTimeout(cc._t);cc._t=setTimeout(upd,80);});
}
initCarousel('advCarousel','advPrev','advNext','advDots');
initCarousel('caseCarousel','casePrev','caseNext','caseDots');
initCarousel('teamCarousel','teamPrev','teamNext','teamDots');
initCarousel('aiCarousel','aiPrev','aiNext','aiDots');

// ===== LIGHTBOX (click to zoom) =====
const lb=document.getElementById('lightbox');
const lbImg=document.getElementById('lbImg');
const lbClose=document.getElementById('lbClose');
const lbPrev=document.getElementById('lbPrev');
const lbNext=document.getElementById('lbNext');
const lbCounter=document.getElementById('lbCounter');

// collect all carousel images into a flat list with their source
let lbImages=[];
document.querySelectorAll('.carousel .slide img').forEach(img=>{
    lbImages.push(img.src);
    img.addEventListener('click',()=>openLb(lbImages.indexOf(img.src)));
});
// also allow page-card images
document.querySelectorAll('.page-card img').forEach(img=>{
    if(!lbImages.includes(img.src)) lbImages.push(img.src);
    img.addEventListener('click',()=>openLb(lbImages.indexOf(img.src)));
});

let lbIdx=0;
function openLb(i){
    lbIdx=i;
    showLb();
    lb.classList.add('show');
    document.body.style.overflow='hidden';
}
function showLb(){
    lbImg.src=lbImages[lbIdx];
    lbCounter.textContent=(lbIdx+1)+' / '+lbImages.length;
}
function closeLb(){
    lb.classList.remove('show');
    document.body.style.overflow='';
}
lbClose.addEventListener('click',closeLb);
lb.addEventListener('click',e=>{if(e.target===lb)closeLb();});
lbPrev.addEventListener('click',()=>{lbIdx=(lbIdx-1+lbImages.length)%lbImages.length;showLb();});
lbNext.addEventListener('click',()=>{lbIdx=(lbIdx+1)%lbImages.length;showLb();});
document.addEventListener('keydown',e=>{
    if(!lb.classList.contains('show')) return;
    if(e.key==='Escape') closeLb();
    if(e.key==='ArrowLeft'){lbIdx=(lbIdx-1+lbImages.length)%lbImages.length;showLb();}
    if(e.key==='ArrowRight'){lbIdx=(lbIdx+1)%lbImages.length;showLb();}
});
</script>
